<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="player.title">Reelkeep player</title>
    <style>
      html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
      video { width: 100%; height: 100%; display: block; object-fit: contain; }
      .err {
        position: absolute; inset: 0; display: grid; place-items: center; color: #8f98b1;
        font: 14px/1.6 ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px;
      }
    </style>
  </head>
  <body>
    <video id="v" controls playsinline preload="metadata"></video>

    <script src="i18n.js"></script>
    <script>
      const q = new URLSearchParams(location.search);
      const src = q.get('src');
      const start = Number(q.get('t') || 0);
      const auto = q.get('autoplay') !== '0';
      const v = document.getElementById('v');
      const post = (msg) => parent.postMessage({ from: 'vg-player', ...msg }, '*');

      if (!src) {
        document.body.innerHTML = `<div class="err">${t('player.nosrc')}</div>`;
      } else {
        v.src = src;
        if (auto) v.play().catch(() => {});
        if (start > 0) {
          v.addEventListener(
            'loadedmetadata',
            () => {
              try { v.currentTime = start; } catch (e) {}
            },
            { once: true },
          );
        }
        let last = 0;
        v.addEventListener('timeupdate', () => {
          if (Math.abs(v.currentTime - last) >= 1) {
            last = v.currentTime;
            post({ type: 'time', t: v.currentTime, paused: v.paused });
          }
        });
        v.addEventListener('loadedmetadata', () => post({ type: 'meta', duration: v.duration }));
        v.addEventListener('error', () => {
          post({ type: 'error' });
          const box = document.createElement('div');
          box.className = 'err';
          box.textContent = t('player.format');
          document.body.append(box);
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'k') v.paused ? v.play() : v.pause();
          if (e.key === 'f') (document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen());
        });
      }
    </script>
  </body>
</html>
