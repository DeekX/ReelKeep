name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-syntax.mjs
      - run: npm test

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SEA config
        run: node scripts/build-sea.mjs
      - name: Prepare SEA blob
        run: node --experimental-sea-config sea-config.json
      # postject is a CI-only dev tool; the shipped app has zero dependencies
      - name: Inject blob into a copy of the Node executable
        shell: bash
        run: |
          cp "$(node -p process.execPath)" "reelkeep-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          npx --yes postject@1.0.0-alpha.6 "reelkeep-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}" NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            ${{ runner.os == 'macOS' && '--macho-segment-name NODE_SEA' || '' }}
      - name: Checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "reelkeep-${{ matrix.name }}"* > "reelkeep-${{ matrix.name }}.sha256";
          else shasum -a 256 "reelkeep-${{ matrix.name }}"* > "reelkeep-${{ matrix.name }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: |
            reelkeep-${{ matrix.name }}*

  extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-icons.mjs
      - run: node scripts/build-extension.mjs
      - name: Zip builds
        run: |
          cd dist
          zip -r ../reelkeep-extension-chrome.zip extension-chrome
          zip -r ../reelkeep-extension-firefox.zip extension-firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: reelkeep-extension-*.zip

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  release:
    needs: [binaries, extension, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          awk '/^## \[/{n++} n==1{print} n==2{exit}' CHANGELOG.md > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ReelKeep ${{ github.ref_name }}" \
            --notes-file notes.md \
            artifacts/*
