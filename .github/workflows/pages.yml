# Browser-only demo (browser-storage mode); full experience needs `node server.js`.
name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - index.html
      - player.html
      - app.js
      - styles.css
      - i18n.js
      - js/**
      - sw.js
      - manifest.webmanifest
      - icons/**
      - data/videos.example.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble the browser-only demo
        run: |
          mkdir -p _site/data
          cp index.html player.html app.js styles.css i18n.js sw.js manifest.webmanifest _site/
          cp -r js _site/js
          cp -r icons _site/icons
          cp data/videos.example.json _site/data/
      # upload-pages-artifact tars the path; deploy-pages@v4 requires a tar (a plain
      # upload-artifact zip fails with "hard links, symlinks" deploy error)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
