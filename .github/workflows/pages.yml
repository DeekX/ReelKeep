name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - index.html
      - player.html
      - app.js
      - styles.css
      - data/videos.example.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble the browser-only demo
        run: |
          mkdir -p _site/data
          cp index.html player.html app.js styles.css _site/
          cp data/videos.example.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
